
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMC QUANT TERMINAL | v4.0 Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              slate: {
                950: '#020617',
                900: '#0a0f1e',
                800: '#151c30',
                700: '#1e293b',
              },
              indigo: {
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
              },
              neon: {
                green: '#10b981',
                red: '#ef4444',
                blue: '#3b82f6',
                purple: '#a855f7'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-main: #f8fafc;
      }
      .dark {
        --bg-main: #020617;
      }
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: var(--bg-main);
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        transition: background-color 0.5s ease;
      }
      .dark body {
        color: #e2e8f0;
      }

      .terminal-glass {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.05);
      }
      .dark .terminal-glass {
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      }

      .neon-shadow-green { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
      .neon-shadow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
      .neon-shadow-indigo { box-shadow: 0 0 15px rgba(79, 70, 229, 0.3); }

      .grain-texture {
        position: relative;
      }
      .grain-texture::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        opacity: 0.02;
        pointer-events: none;
        z-index: 10;
      }
      .dark .grain-texture::before {
        opacity: 0.03;
      }

      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .dark ::-webkit-scrollbar-thumb { background: #1e293b; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      .animate-pulse-slow {
        animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }

      .nav-active-glow {
        position: relative;
      }
      .nav-active-glow::after {
        content: '';
        position: absolute;
        left: -10px;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 20px;
        background: #6366f1;
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 10px #6366f1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "marked": "https://esm.sh/marked@^17.0.1",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body class="grain-texture">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
