    <style>
      :root {
        --bg-main: #f1f5f9;
        --grid-line: rgba(0, 0, 0, 0.04);
      }
      .dark {
        --bg-main: #040711;
        --grid-line: rgba(255, 255, 255, 0.035);
      }
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: var(--bg-main);
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .dark body {
        color: #e2e8f0;
      }

      /* Cybernetic HUD Grid Background */
      .cyber-grid {
        background-image: 
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      /* Institutional Terminal Glass with Hairline Border */
      .hud-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .dark .hud-panel {
        background: rgba(8, 13, 26, 0.78);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
      }

      .hud-panel-highlight {
        position: relative;
      }
      .hud-panel-highlight::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(0, 229, 255, 0.3), rgba(139, 92, 246, 0.2), transparent 70%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* Glowing Laser Edge Tickers */
      .glow-cyan {
        box-shadow: 0 0 20px -3px rgba(0, 229, 255, 0.35);
      }
      .glow-emerald {
        box-shadow: 0 0 20px -3px rgba(0, 245, 155, 0.35);
      }
      .glow-rose {
        box-shadow: 0 0 20px -3px rgba(255, 51, 102, 0.35);
      }

      /* Custom High-Frequency Precision Scrollbar */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #1b2647; }
      ::-webkit-scrollbar-thumb:hover { background: #00e5ff; }

      /* Ticker Tape continuous flow effect */
      @keyframes ticker-fade {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .ticker-pulse {
        animation: ticker-fade 2s infinite ease-in-out;
      }
    </style>
